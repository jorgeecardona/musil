[project]
# musil: named for Robert Musil (engineer-mathematician turned novelist, "The Man Without
# Qualities"). A standalone, dependency-free explicit-state model checker.
name = "musil"
dynamic = ["version"]  # the single source of truth is __version__ in src/musil/__init__.py (see [tool.hatch.version])
description = "Model checker for Python: tries every interleaving to find races and deadlocks, in pytest"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jorge Cardona", email = "jorgeecardona@gmail.com" }]
keywords = [
    "model-checking",
    "formal-methods",
    "verification",
    "state-machine",
    "concurrency",
    "liveness",
    "safety",
    "temporal-logic",
    "ltl",
    "probabilistic",
    "markov-chain",
    "mdp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
musil = "musil.__main__:main"

[project.optional-dependencies]
# docs are an *extra* (not a uv dependency-group): `uv run --extra docs mkdocs build` installs them
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-llmstxt>=0.5",
]

[project.urls]
Homepage = "https://gitlab.com/cardona-oss/musil"
Repository = "https://gitlab.com/cardona-oss/musil"
Issues = "https://gitlab.com/cardona-oss/musil/-/issues"
Changelog = "https://gitlab.com/cardona-oss/musil/-/blob/main/CHANGELOG.md"
Documentation = "https://musil-d34e71.gitlab.io/"

[tool.uv]
# After the pre-commit hook auto-bumps __version__ in the package __init__, uv must treat the
# editable install as stale and reinstall it; without the __init__ key the next `make check`
# runs against the old version. (pyproject is already an implicit key; __init__ is the version source.)
cache-keys = [{ file = "pyproject.toml" }, { file = "src/musil/__init__.py" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The version lives as __version__ in the package itself; hatchling reads it (by regex, no import) so
# pyproject and the runtime never disagree. scripts/bump-version rewrites that literal.
path = "src/musil/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/musil"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright[nodejs]>=1.1.390",
    "pytest>=8",
    "prodc>=0.11.4,<0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
# The docstrings use mathematical notation; ∨ (logical OR) pairs with the ∧ / ¬ already used and is not a typo.
allowed-confusables = ["∨"]

[tool.ruff.lint.isort]
known-first-party = ["musil"]

[tool.pyright]
include = ["src", "tests", "examples"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
