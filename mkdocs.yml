site_name: musil
site_description: A tiny, dependency-free explicit-state model checker for Python.
site_url: https://musil-d34e71.gitlab.io/
repo_url: https://gitlab.com/jorgeecardona/musil
repo_name: jorgeecardona/musil
copyright: MIT &copy; Jorge Cardona

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            docstring_section_style: spacy

nav:
  - Home: index.md
  - Verifying a distributed system: verifying-distributed-systems.md
  - Examples:
    - Overview: textbook.md
    - Finite-state machines:
      - Traffic light: examples/traffic_light.md
      - Service lifecycle: examples/service_lifecycle.md
    - Shared-memory concurrency:
      - Lost update: examples/lost_update.md
      - Producer–consumer: examples/producer_consumer.md
      - Mutual exclusion (Peterson): examples/mutex.md
      - Readers–writers: examples/readers_writers.md
      - Dining philosophers: examples/dining_philosophers.md
      - Bank transfer: examples/bank_transfer.md
      - Vote tallying: examples/voting_tally.md
    - Distributed protocols:
      - Reconciliation under loss: examples/route_delivery.md
      - Partition + heal: examples/partition_heal.md
      - Alternating Bit Protocol: examples/alternating_bit.md
      - Leader election: examples/leader_election.md
    - Open systems:
      - K8s scheduler: examples/k8s_scheduler.md
      - Byzantine service: examples/byzantine_service.md
      - Multi-environment composition: examples/open_system_composed.md
      - TCAS II: examples/tcas.md
  - Open systems: open-systems.md
  - Pre-built environments: environments.md
  - Paper draft: paper.md
  - API reference: api.md
  - Changelog: changelog.md
