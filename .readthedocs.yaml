# Read the Docs build config. https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

# Install musil itself (so mkdocstrings can import it) plus the docs extras.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
